<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #2563EB;
            --secondary: #0D9488;
            --accent: #F59E0B;
            --bg-color: #F4F5F7;
            --text-color: #1E293B;
            --card-bg: #FFFFFF;
            --card-border: #E2E8F0;
            --header-bg: transparent;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            --drawer-bg: #FFFFFF;
            --overlay-bg: rgba(0, 0, 0, 0.4);
            --btn-bg: #E2E8F0;
            --btn-hover: #CBD5E1;
            --header-glass: rgba(255, 255, 255, 0.82);
            --accent-gradient-1: linear-gradient(135deg, var(--primary) 0%, #1D4ED8 100%);
            --accent-gradient-2: linear-gradient(135deg, var(--secondary) 0%, #0F766E 100%);
        }

        [data-theme="dark"] {
            --primary: #3B82F6;
            --secondary: #14B8A6;
            --accent: #FBBF24;
            --bg-color: #070C1B;
            --text-color: #F1F5F9;
            --card-bg: #101A30;
            --card-border: #16223C;
            --header-bg: transparent;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            --drawer-bg: #101A30;
            --overlay-bg: rgba(0, 0, 0, 0.6);
            --btn-bg: #16223C;
            --btn-hover: #2C3B5C;
            --header-glass: rgba(7, 12, 27, 0.82);
            --accent-gradient-1: linear-gradient(135deg, var(--primary) 0%, #2563EB 100%);
            --accent-gradient-2: linear-gradient(135deg, var(--secondary) 0%, #0D9488 100%);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 100px 24px 24px 24px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            position: relative;
            overflow-x: hidden;
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.35;
            pointer-events: none;
            animation: float 14s ease-in-out infinite;
        }
        [data-theme="dark"] .blob { opacity: 0.28; }

        .blob-1 { width: 340px; height: 340px; top: -120px; right: -100px; background: var(--primary); }
        .blob-2 { width: 300px; height: 300px; bottom: -100px; left: -100px; background: var(--secondary); animation-delay: -5s; }
        .blob-3 { width: 220px; height: 220px; bottom: 20%; right: -80px; background: var(--accent); opacity: 0.22; animation-delay: -9s; }
        [data-theme="dark"] .blob-3 { opacity: 0.16; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-16px, 22px) scale(1.06); }
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .site-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 30px;
            background-color: var(--header-bg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 90;
            border-bottom: 1px solid transparent;
            transition: background-color 0.25s ease, border-color 0.25s ease, backdrop-filter 0.25s ease;
        }

        .site-header.scrolled {
            background-color: var(--header-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--card-border);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .site-brand {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 23px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--text-color) 0%, var(--text-color) 60%, var(--primary) 130%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.03em;
            text-decoration: none;
        }

        .site-brand .dot {
            color: var(--accent);
            -webkit-text-fill-color: var(--accent);
            font-size: 24px;
            display: inline-block;
            animation: pulse-dot 2.4s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.35); opacity: 0.7; }
        }

        .burger-btn {
            width: 42px;
            height: 42px;
            background-color: var(--btn-bg);
            border: none;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-color);
            transition: background-color 0.2s ease;
        }

        .burger-btn:hover {
            background-color: var(--btn-hover);
        }

        .burger-btn svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
        }

        .user-email-tag {
            font-size: 13px;
            opacity: 0.7;
            color: var(--text-color);
        }

        .title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(28px, 5vw, 38px);
            font-weight: 800;
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: -0.02em;
            color: var(--text-color);
        }

        .character-selector {
            display: flex;
            flex-direction: row;
            gap: 32px;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 600px;
        }

        @media (max-width: 520px) {
            .character-selector {
                flex-direction: column;
                gap: 28px;
            }
        }

        .character-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .character-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 180px;
            height: 180px;
            border-radius: 42px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            text-decoration: none;
            box-shadow: var(--shadow-sm);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.3s ease,
                        border-color 0.3s ease;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .squircle-avatar {
            width: 100px;
            height: 100px;
            border-radius: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 36px;
            font-weight: 700;
            color: #FFFFFF;
            transition: transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .squircle-avatar img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: inherit;
        }

        .avatar-1 { background: var(--accent-gradient-1); }
        .avatar-2 { background: var(--accent-gradient-2); }

        .character-btn:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: var(--shadow-lg), 0 0 24px -4px rgba(37, 99, 235, 0.3);
            border-color: var(--accent);
        }

        .character-btn:hover .squircle-avatar {
            transform: scale(1.1);
        }

        .character-btn.current {
            border-color: var(--accent);
            border-width: 2px;
        }

        .character-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-color);
            background-color: var(--card-bg);
            padding: 10px 24px;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            text-align: center;
            min-width: 140px;
            box-shadow: var(--shadow-sm);
            pointer-events: none;
            letter-spacing: 0.01em;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        .menu-drawer {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100%;
            background-color: var(--drawer-bg);
            box-shadow: 4px 0 20px rgba(0, 0, 0, 0.2);
            z-index: 200;
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-drawer.open {
            left: 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--overlay-bg);
            z-index: 150;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .menu-items {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-radius: 12px;
            color: var(--text-color);
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
            background-color: transparent;
            border: none;
            width: 100%;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .menu-item:hover {
            background-color: var(--btn-bg);
        }

        .menu-item svg {
            stroke: var(--text-color);
            transition: stroke 0.2s ease;
        }

        .theme-toggle-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .toggle-switch {
            width: 44px;
            height: 24px;
            background-color: var(--btn-bg);
            border-radius: 20px;
            position: relative;
            transition: background-color 0.3s ease;
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: #FFFFFF;
            transition: transform 0.3s ease;
        }

        [data-theme="dark"] .toggle-switch {
            background-color: var(--primary);
        }

        [data-theme="dark"] .toggle-switch::after {
            transform: translateX(20px);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--text-color);
            color: var(--bg-color);
            padding: 12px 24px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            opacity: 0;
            transition: transform 0.3s ease, opacity 0.3s ease;
            z-index: 200;
            border-left: 4px solid var(--accent);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body>

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <header class="site-header" id="siteHeader">
        <div class="header-left">
            <button class="burger-btn" id="burgerBtn" aria-label="Toggle Menu">
                <svg viewBox="0 0 24 24">
                    <line x1="4" y1="7" x2="20" y2="7"></line>
                    <line x1="4" y1="12" x2="20" y2="12"></line>
                    <line x1="4" y1="17" x2="20" y2="17"></line>
                </svg>
            </button>
            <a href="#" class="site-brand">JKJF<span class="dot">.</span></a>
        </div>
        <span class="user-email-tag" id="userEmailTag"></span>
    </header>

    <nav class="menu-drawer" id="menuDrawer">
        <ul class="menu-items">
            <li>
                <button class="menu-item" id="shareBtn">
                    <span>Share Page</span>
                    <svg width="18" height="18" fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8M16 6l-4-4-4 4M12 2v13"/></svg>
                </button>
            </li>
            <li>
                <button class="menu-item theme-toggle-btn" id="themeToggleBtn">
                    <span id="themeLabel">Dark Mode</span>
                    <div class="toggle-switch"></div>
                </button>
            </li>
            <li>
                <a href="mailto:jkjfofficial@gmail.com?subject=Portfolio%20Feedback" class="menu-item">
                    <span>Contact / Feedback</span>
                    <svg width="18" height="18" fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                </a>
            </li>
            <li>
                <button class="menu-item" id="logoutBtn">
                    <span>Log Out</span>
                    <svg width="18" height="18" fill="none" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                </button>
            </li>
        </ul>
    </nav>

    <div class="overlay" id="drawerOverlay"></div>

    <h1 class="title">I'm a:</h1>

    <div class="character-selector">
        <div class="character-card">
            <button class="character-btn" id="jobSeekerBtn" aria-label="Job Seeker Profile">
                <div class="squircle-avatar avatar-1">
                    J
                    <img src="images/jobseeker.png" alt="Job Seeker" onerror="this.remove();">
                </div>
            </button>
            <div class="character-name">Jobs</div>
        </div>

        <div class="character-card">
            <button class="character-btn" id="employerBtn" aria-label="Employer Profile">
                <div class="squircle-avatar avatar-2">
                    K
                    <img src="images/employer.png" alt="Employer" onerror="this.remove();">
                </div>
            </button>
            <div class="character-name">Employers</div>
        </div>
    </div>

    <div class="toast" id="toastNotification">Link copied to clipboard!</div>

    <script>
        const SUPABASE_URL = "https://zemxezibfcogzkhvjrxn.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplbXhlemliZmNvZ3praHZqcnhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNDQ2MzYsImV4cCI6MjEwMTkyMDYzNn0.fKRfqa57unFDrWvGvt7qPQ3-WBYuC0f36J-GI1X8cIQ";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;

        async function requireLogin() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.href = "login.html";
                return null;
            }
            return session.user;
        }

        async function init() {
            currentUser = await requireLogin();
            if (!currentUser) return;

            document.getElementById('userEmailTag').textContent = currentUser.email;

            const { data: profile } = await supabaseClient
                .from('profiles')
                .select('role')
                .eq('id', currentUser.id)
                .maybeSingle();

            if (profile && profile.role === 'jobseeker') {
                document.getElementById('jobSeekerBtn').classList.add('current');
            } else if (profile && profile.role === 'employer') {
                document.getElementById('employerBtn').classList.add('current');
            }
        }

        async function chooseRole(role, destination) {
            if (!currentUser) return;

            const { error } = await supabaseClient
                .from('profiles')
                .upsert({ id: currentUser.id, role: role, email: currentUser.email });

            if (error) {
                alert('Could not save your role: ' + error.message);
                return;
            }

            window.location.href = destination;
        }

        document.getElementById('jobSeekerBtn').addEventListener('click', () => chooseRole('jobseeker', 'jobs.html'));
        document.getElementById('employerBtn').addEventListener('click', () => chooseRole('employer', 'personnel.html'));

        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        });

        const burgerBtn = document.getElementById('burgerBtn');
        const menuDrawer = document.getElementById('menuDrawer');
        const drawerOverlay = document.getElementById('drawerOverlay');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeLabel = document.getElementById('themeLabel');
        const shareBtn = document.getElementById('shareBtn');
        const toast = document.getElementById('toastNotification');
        const siteHeader = document.getElementById('siteHeader');

        function toggleMenu() {
            menuDrawer.classList.toggle('open');
            drawerOverlay.classList.toggle('active');
        }

        burgerBtn.addEventListener('click', toggleMenu);
        drawerOverlay.addEventListener('click', toggleMenu);

        /* THEME: honors system light/dark by default, but remembers a manual choice */
        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
            themeLabel.textContent = theme === 'dark' ? 'Dark Mode' : 'Light Mode';
        }

        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)');
        const storedTheme = localStorage.getItem('theme');
        applyTheme(storedTheme || (systemPrefersDark.matches ? 'dark' : 'light'));

        systemPrefersDark.addEventListener('change', (e) => {
            if (!localStorage.getItem('theme')) {
                applyTheme(e.matches ? 'dark' : 'light');
            }
        });

        themeToggleBtn.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            localStorage.setItem('theme', newTheme);
            applyTheme(newTheme);
        });

        /* Header divider line — appears once you scroll past the top */
        window.addEventListener('scroll', () => {
            if (window.scrollY > 12) siteHeader.classList.add('scrolled');
            else siteHeader.classList.remove('scrolled');
        }, { passive: true });

        shareBtn.addEventListener('click', async () => {
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: 'Select Profile',
                        url: window.location.href
                    });
                } catch (err) {}
            } else {
                navigator.clipboard.writeText(window.location.href);
                showToast();
            }
            toggleMenu();
        });

        function showToast() {
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        init();
    </script>
</body>
    </html>
